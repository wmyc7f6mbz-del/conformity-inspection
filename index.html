      font-size: 13px;
      color: #27ae60;
      font-weight: bold;
    }
    .btn-group {

    }

      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-email { background-color: #27ae60; color: #fff; }
    .btn-pdf { background-color: #2b579a; color: #fff; }

      font-size: 13px;

    .info-table td.label {

      font-weight: bold;
      width: 12%;
      text-align: center;
    }
    .input-text {
      width: 100%;
      border: none;
      border-bottom: 1px dashed #999;
      outline: none;
      font-size: 13px;
      padding: 2px 4px;
    }

    .sig-inline {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sig-canvas-box {
      border: 1px solid #ccc;
      background: #fafafa;
    }
    canvas {
      touch-action: none;
      display: block;
    }

      border: 1px solid #000;
      padding: 6px 8px;
      font-size: 13px;

      font-size: 12px;

    const tbody = document.getElementById('survey-tbody');
    let catCounter = 0;
    let subCounter = 0;

    rawData.forEach((group) => {
      catCounter++;
      const catTr = document.createElement('tr');
      catTr.className = 'category-row';
      catTr.innerHTML = `
        <td>${group.cat}</td>
        <td class="text-center">
          <select id="cat-res-${catCounter}" class="select-result auto-save">
            <option value="">선택</option>
            <option value="적합">적합</option>
            <option value="부적합">부적합</option>

        tdRes.className = 'text-center';

          <select id="sub-res-${subCounter}" class="select-result auto-save">
            <option value="">선택</option>
            <option value="적합">적합</option>
            <option value="부적합">부적합</option>
            <option value="해당없음">해당없음</option>
          </select>
        `;

        tdNote.innerHTML = `<input type="text" id="sub-note-${subCounter}" class="input-text auto-save">`;

        tr.appendChild(tdSub);
        tr.appendChild(tdRes);
        tr.appendChild(tdNote);
        tbody.appendChild(tr);
      });

      const memoTr = document.createElement('tr');
      memoTr.className = 'memo-row';
      memoTr.innerHTML = `
        <td colspan="3">
          <textarea id="cat-memo-${catCounter}" class="memo-area auto-save" placeholder="[${group.cat.split('.')[0]}번 항목 관련 메모 / 특이사항 작성란]"></textarea>

    // ----------------------------------------------------
    // Canvas 전자서명 로직
    // ----------------------------------------------------
    function initCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      let isDrawing = false;

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function startDraw(e) { isDrawing = true; draw(e); }
      function endDraw() { 
        if (isDrawing) {
          isDrawing = false; 
          ctx.beginPath();
          saveSignatures();
        }
      }
      function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', endDraw);
      canvas.addEventListener('mouseleave', endDraw);

      canvas.addEventListener('touchstart', startDraw);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', endDraw);
    }

    function clearCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      saveSignatures();
    }

    const sigIds = ['sig-canvas-w1', 'sig-canvas-w2', 'sig-canvas-i1', 'sig-canvas-i2'];
    sigIds.forEach(id => initCanvas(id));

    // ----------------------------------------------------
    // 자동 저장 및 복원 로직
    // ----------------------------------------------------
    function saveFormData() {
      const data = {};
      document.querySelectorAll('.auto-save').forEach(el => {
        data[el.id] = el.value;
      });
      localStorage.setItem('survey_form_data_v5', JSON.stringify(data));
    }

    function saveSignatures() {
      sigIds.forEach(id => {
        const dataUrl = document.getElementById(id).toDataURL();
        localStorage.setItem(`survey_sig_${id}`, dataUrl);
      });
    }

    function loadSavedData() {
      const saved = localStorage.getItem('survey_form_data_v5');
      if (saved) {
        const data = JSON.parse(saved);
        Object.keys(data).forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = data[id];
        });
      }

      sigIds.forEach(id => {
        loadSig(id, localStorage.getItem(`survey_sig_${id}`));
      });
    }

    function loadSig(canvasId, dataUrl) {
      if (!dataUrl) return;
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
      };
      img.src = dataUrl;
    }

    document.addEventListener('change', (e) => {
      if (e.target.classList.contains('auto-save')) saveFormData();
    });
    document.addEventListener('keyup', (e) => {
      if (e.target.classList.contains('auto-save')) saveFormData();
    });

    function resetForm() {
      if (confirm("작성된 모든 내용을 삭제하고 초기화하시겠습니까?")) {
        localStorage.removeItem('survey_form_data_v5');
        sigIds.forEach(id => localStorage.removeItem(`survey_sig_${id}`));
        location.reload();
      }
    }

    window.addEventListener('load', loadSavedData);

    // ----------------------------------------------------
    // PDF 다운로드
    // ----------------------------------------------------
    function exportToPDF() {
      const clearBtns = document.querySelectorAll('.clear-btn');
      clearBtns.forEach(btn => btn.style.display = 'none');

      const element = document.getElementById('survey-form');
      const opt = {
        margin:       [8, 8, 8, 8],
        filename:     '방송통신설비_기술기준_적합_조사_시험_평가표.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        clearBtns.forEach(btn => btn.style.display = 'inline-block');
      });
    }

    // ----------------------------------------------------
    // 이메일 직접 전송 로직 (EmailJS)
    // ----------------------------------------------------
    function sendEmail() {
      if (EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
        alert("EmailJS 연동 키가 설정되지 않았습니다.\n코드 하단의 키값을 먼저 입력해주세요.");
        return;
      }

      const targetEmail = prompt("전송받을 사무실 이메일 주소를 입력하세요:");
      if (!targetEmail) return;

      const statusMsg = document.getElementById('status-msg');
      statusMsg.textContent = "⏳ 이메일 전송 중입니다. 잠시만 기다려주세요...";

      const clearBtns = document.querySelectorAll('.clear-btn');
      clearBtns.forEach(btn => btn.style.display = 'none');

      const element = document.getElementById('survey-form');
      const opt = {
        margin:       [8, 8, 8, 8],
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
      };

      // PDF 데이터 생성 후 EmailJS 전송
      html2pdf().set(opt).from(element).outputPdf('datauristring').then((pdfBase64) => {
        clearBtns.forEach(btn => btn.style.display = 'inline-block');

        const templateParams = {
          to_email: targetEmail,
          org_name: document.getElementById('info-org').value || '미입력',
          date_place: document.getElementById('info-date-place').value || '미입력',
          content_pdf: pdfBase64
        };

        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
          .then(() => {
            alert("✓ 사무실 이메일로 전송이 완료되었습니다!");
            statusMsg.textContent = "✓ 작성 내용이 실시간 자동 저장됩니다.";
          }, (err) => {
            alert("전송 실패: " + JSON.stringify(err));
            statusMsg.textContent = "❌ 이메일 전송 실패";
          });
      });
    }
  </script>
